<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奶娃</title>
<meta name="description" content="奶娃视频 + 跑酷小游戏">
<meta name="theme-color" content="#10b981">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green-50: #ecfdf5;
  --green-100: #d1fae5;
  --green-200: #a7f3d0;
  --green-300: #6ee7b7;
  --green-400: #34d399;
  --green-500: #10b981;
  --green-600: #059669;
  --green-700: #047857;
  --green-800: #065f46;
  --green-900: #064e3b;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  min-height: 100dvh;
  background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
  animation: pulse 8s ease-in-out infinite;
  pointer-events: none;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 0.8; }
}

.main-container {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
}

.header {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px 16px;
  gap: 15px;
}

.header-logo {
  width: auto;
  height: 80px;
  object-fit: contain;
}

.header-text {
  font-size: 36px;
  font-weight: 700;
  color: var(--green-800);
  letter-spacing: 3px;
}

.tab-container {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}

.tab-btn {
  padding: 10px 32px;
  border-radius: 30px;
  border: none;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tab-btn.active {
  background: linear-gradient(135deg, var(--green-500) 0%, var(--green-600) 100%);
  color: #fff;
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
}

.tab-btn:not(.active) {
  background: rgba(255, 255, 255, 0.8);
  color: var(--green-700);
}

.tab-btn:not(.active):hover {
  background: #fff;
  transform: translateY(-2px);
}

.content-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 20px;
}

.video-section {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.video-wrap {
  width: 100%;
  max-width: 340px;
  aspect-ratio: 9 / 16;
  border-radius: 24px;
  overflow: hidden;
  background: var(--green-100);
  margin-bottom: 20px;
  position: relative;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 20px 60px rgba(6, 95, 70, 0.25), 0 8px 24px rgba(6, 95, 70, 0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.video-wrap:hover {
  transform: translateY(-4px);
  box-shadow: 0 28px 80px rgba(6, 95, 70, 0.3), 0 12px 32px rgba(6, 95, 70, 0.2);
}

.video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.play-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(6, 95, 70, 0.2);
}

.play-icon.hide {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.6);
}

.play-icon svg {
  width: 24px; height: 24px;
  fill: var(--green-600);
  margin-left: 2px;
}

.version-name {
  font-size: 15px;
  color: var(--green-700);
  margin-bottom: 16px;
  height: 22px;
  font-weight: 500;
}

.controls {
  display: flex;
  align-items: center;
  gap: 24px;
}

.ctrl-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(10px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
  outline: none;
  box-shadow: 0 4px 12px rgba(6, 95, 70, 0.1);
}

.ctrl-btn:hover {
  background: rgba(255, 255, 255, 1);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(6, 95, 70, 0.15);
}

.ctrl-btn:active {
  transform: scale(0.92);
  box-shadow: 0 2px 8px rgba(6, 95, 70, 0.1);
}

.ctrl-btn svg {
  width: 20px; height: 20px;
  fill: var(--green-700);
}

.ctrl-btn.loop-btn {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--green-500) 0%, var(--green-600) 100%);
  box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
}

.ctrl-btn.loop-btn:hover {
  background: linear-gradient(135deg, var(--green-400) 0%, var(--green-500) 100%);
  box-shadow: 0 12px 32px rgba(16, 185, 129, 0.5);
}

.ctrl-btn.loop-btn svg {
  width: 26px; height: 26px;
  fill: #fff;
}

.dots {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(6, 95, 70, 0.3);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.dot:hover {
  background: rgba(6, 95, 70, 0.5);
  transform: scale(1.2);
}

.dot.active {
  background: var(--green-600);
  width: 24px;
  border-radius: 4px;
}

.game-section {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.game-container {
  position: relative;
  width: 100%;
  max-width: 600px;
  height: 400px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(6, 95, 70, 0.25);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.game-ui {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
}

.score-box {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  padding: 10px 16px;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(6, 95, 70, 0.15);
}

.score-label {
  font-size: 11px;
  color: var(--green-600);
  margin-bottom: 2px;
}

.score-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--green-800);
}

.score-progress {
  width: 100px;
  height: 4px;
  background: rgba(16, 185, 129, 0.2);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--green-400) 0%, var(--green-600) 100%);
  border-radius: 2px;
  transition: width 0.1s linear;
}

.max-score-badge {
  background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
  color: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  animation: glow 1s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
  50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.8); }
}

.start-screen, .game-over-screen {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(6, 78, 59, 0.92);
  z-index: 100;
}

.game-over-screen {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.game-over-screen.show {
  opacity: 1;
  pointer-events: auto;
}

.frog-emoji {
  font-size: 64px;
  margin-bottom: 20px;
  animation: bounce 1s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

.game-title {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
}

.game-subtitle {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.8);
  margin-bottom: 24px;
}

.game-btn {
  background: #fff;
  color: var(--green-600);
  border: none;
  padding: 14px 40px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(255, 255, 255, 0.25);
  transition: all 0.3s ease;
}

.game-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(255, 255, 255, 0.35);
}

.game-btn:active {
  transform: scale(0.95);
}

.game-instruction {
  margin-top: 20px;
  color: rgba(255, 255, 255, 0.7);
  font-size: 12px;
}

.final-score {
  font-size: 48px;
  font-weight: 800;
  color: var(--green-300);
  margin-bottom: 8px;
}

.new-record {
  font-size: 14px;
  color: #ffd700;
  margin-bottom: 24px;
  animation: pulse 0.5s ease-in-out infinite;
}

.frog-character-container {
  position: absolute;
  width: 80px;
  height: 96px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(16, 185, 129, 0.3);
  z-index: 50;
  pointer-events: none;
  transition: transform 0.1s ease-out;
  border: 3px solid rgba(16, 185, 129, 0.5);
}

.frog-character-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.gh-link {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  opacity: 0.3;
  z-index: 99;
  transition: all 0.3s ease;
}

.gh-link:hover {
  opacity: 0.7;
  transform: scale(1.1);
}

.gh-link svg {
  width: 100%;
  height: 100%;
  fill: var(--green-800);
}

@media (max-width: 600px) {
  .title { font-size: 22px; }
  .subtitle { font-size: 12px; }
  .tab-container { gap: 8px; }
  .tab-btn { padding: 8px 20px; font-size: 13px; }
  
  .video-wrap { max-width: 90%; height: auto; aspect-ratio: 9 / 16; }
  .ctrl-btn { width: 44px; height: 44px; }
  .ctrl-btn.loop-btn { width: 52px; height: 52px; }
  
  .game-container { 
    height: min(55vh, 420px); 
    min-height: 280px;
    border-radius: 12px;
  }
  .frog-character-container { 
    width: 75px; 
    height: 75px;
    border-radius: 50%;
  }
  
  .score-box { padding: 8px 12px; }
  .score-label { font-size: 10px; }
  .score-value { font-size: 18px; }
  .score-progress { width: 80px; }
  
  .game-title { font-size: 22px; }
  .game-subtitle { font-size: 12px; }
  .game-btn { padding: 12px 32px; font-size: 14px; }
  .game-instruction { font-size: 10px; }
  .frog-emoji { font-size: 48px; }
  .final-score { font-size: 36px; }
  
  .header { padding: 16px 12px 12px; }
  .content-area { padding: 0 12px; }
}

@media (max-width: 480px) {
  .title { font-size: 18px; }
  .video-wrap { max-width: 95%; }
  .controls { gap: 16px; }
  .ctrl-btn { width: 40px; height: 40px; }
  .ctrl-btn.loop-btn { width: 48px; height: 48px; }
  .frog-character-container { width: 65px; height: 65px; }
  .game-container { height: min(50vh, 380px); min-height: 260px; }
}
</style>
</head>
<body>
<div class="main-container">
  <header class="header">
    <img src="https://pan.imgbed.link/file/370955" alt="奶娃" class="header-logo">
    <span class="header-text">奶蛙的世界</span>
  </header>

  <div class="tab-container">
    <button class="tab-btn active" id="videoTab">🎬 视频</button>
    <button class="tab-btn" id="gameTab">🎮 跑酷游戏</button>
  </div>

  <main class="content-area">
    <section class="video-section" id="videoSection">
      <div class="video-wrap" id="videoWrap">
        <video id="player" loop playsinline preload="metadata" poster="https://xinyewebsite.com/games/milk-frog/image/glimpse.jpg">
        </video>
        <div class="play-icon" id="playIcon">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <div class="version-name" id="versionName">惊鸿一瞥</div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="上一个">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="ctrl-btn loop-btn" id="loopBtn" aria-label="播放">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="下一个">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>

      <div class="dots" id="dots"></div>
    </section>

    <section class="game-section" id="gameSection">
      <div class="game-container">
        <canvas class="game-canvas" id="gameCanvas"></canvas>
        
        <div class="frog-character-container" id="frogCharacterContainer">
          <video class="frog-character-video" id="frogRunVideo" loop muted playsinline>
            <source src="https://pan.imgbed.link/file/370915" type="video/mp4">
          </video>
          <video class="frog-character-video" id="frogJumpVideo" loop muted playsinline style="display: none;">
            <source src="https://pan.imgbed.link/file/370918" type="video/mp4">
          </video>
          <video class="frog-character-video" id="frogFallVideo" muted playsinline style="display: none;">
            <source src="https://pan.imgbed.link/file/370917" type="video/mp4">
          </video>
        </div>
        
        <div class="game-ui">
          <div class="score-box">
            <div class="score-label">得分</div>
            <div class="score-value" id="gameScore">0</div>
            <div class="score-progress">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>
          <div class="max-score-badge" id="maxBadge" style="display: none;">满分!</div>
        </div>

        <div class="start-screen" id="gameStartScreen">
          <div class="frog-emoji">🐸</div>
          <div class="game-title">奶蛙跑酷</div>
          <div class="game-subtitle">帮助奶蛙躲避障碍物</div>
          <button class="game-btn" id="startGameBtn">开始游戏</button>
          <div class="game-instruction">点击屏幕 / 空格键 / ↑ 跳跃 | 目标: 10000分</div>
        </div>

        <div class="game-over-screen" id="gameOverScreen">
          <div class="frog-emoji" id="endFrog">🐸</div>
          <div class="game-title">游戏结束</div>
          <div class="final-score" id="finalGameScore">0</div>
          <div class="new-record" id="gameNewRecord" style="display: none;">🎉 新纪录！</div>
          <button class="game-btn" id="restartGameBtn">再来一次</button>
        </div>
      </div>
    </section>
  </main>

  <a href="https://github.com/ludii12/naiwa1.2" target="_blank" class="gh-link">
    <svg viewBox="0 0 24 24" fill="#000" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.373 0 0 5.373 0 12C0 17.302 3.438 21.8 8.207 23.387C8.806 23.498 9.018 23.126 9.018 22.806C9.018 22.525 9.008 21.82 9.003 20.757C5.964 21.428 5.212 19.12 5.212 19.12C4.652 17.698 3.875 17.32 3.875 17.32C2.754 16.506 3.968 16.52 3.968 16.52C5.254 16.61 5.96 17.793 5.96 17.793C7.107 19.787 8.952 19.22 9.034 18.92C9.144 18.077 9.48 17.47 9.856 17.136C7.165 16.842 4.333 15.793 4.333 11.998C4.333 10.72 4.812 9.73 5.668 8.954C5.545 8.654 5.143 7.482 5.866 5.962C5.866 5.962 6.853 5.643 8.997 7.146C9.954 6.88 10.976 6.75 12 6.746C13.024 6.75 14.047 6.88 15.006 7.146C17.148 5.643 18.133 5.962 18.133 5.962C18.858 7.482 18.456 8.654 18.334 8.954C19.19 9.73 19.664 10.716 19.664 11.998C19.664 15.807 16.826 16.837 14.134 17.136C14.57 17.451 14.948 18.114 14.948 19.103C14.948 20.574 14.93 22.368 14.93 22.806C14.93 23.13 15.139 23.504 15.746 23.385C20.564 21.797 24 17.3 24 12C24 5.373 18.627 0 12 0Z"/></svg>
  </a>
</div>

<script>
const BASE = 'https://xinyewebsite.com/games/milk-frog';
const VIDEO_LIST = [
  { name: '惊鸿一瞥', video: `${BASE}/video/glimpse.mp4`, poster: `${BASE}/image/glimpse.jpg` },
  { name: '龟速前进', video: `${BASE}/video/turtle.mp4`, poster: `${BASE}/image/turtle.jpg` },
  { name: '相视一笑', video: `${BASE}/video/police.mp4`, poster: `${BASE}/image/police.jpg` },
  { name: '万有引力', video: `${BASE}/video/apple.mp4`, poster: `${BASE}/image/apple.jpg` },
  { name: '白菜对我笑', video: `${BASE}/video/cabbage.mp4`, poster: `${BASE}/image/cabbage.jpg` },
];

const GAME_MAX_SCORE = 10000;

let videoIdx = 0;
let videoPlaying = false;

const player = document.getElementById('player');
const playIcon = document.getElementById('playIcon');
const versionName = document.getElementById('versionName');
const dotsEl = document.getElementById('dots');
const loopBtn = document.getElementById('loopBtn');
const videoWrap = document.getElementById('videoWrap');

VIDEO_LIST.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.onclick = () => switchVideo(i);
  dotsEl.appendChild(d);
});

function loadVideo(i) {
  player.poster = VIDEO_LIST[i].poster;
  player.src = VIDEO_LIST[i].video;
  player.load();
  versionName.textContent = VIDEO_LIST[i].name;
  document.querySelectorAll('.dot').forEach((d, j) => {
    d.classList.toggle('active', j === i);
  });
}

function switchVideo(i) {
  player.pause();
  videoPlaying = false;
  updateVideoUI();
  videoIdx = i;
  loadVideo(i);
  setTimeout(() => { toggleVideoPlay(); }, 150);
}

function toggleVideoPlay() {
  if (videoPlaying) {
    player.pause();
    videoPlaying = false;
  } else {
    player.play().catch(() => {});
    videoPlaying = true;
  }
  updateVideoUI();
}

function updateVideoUI() {
  if (videoPlaying) {
    playIcon.classList.add('hide');
    loopBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  } else {
    playIcon.classList.remove('hide');
    loopBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  }
}

videoWrap.addEventListener('click', toggleVideoPlay);
loopBtn.addEventListener('click', toggleVideoPlay);
document.getElementById('prevBtn').addEventListener('click', () => {
  switchVideo(videoIdx === 0 ? VIDEO_LIST.length - 1 : videoIdx - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  switchVideo(videoIdx === VIDEO_LIST.length - 1 ? 0 : videoIdx + 1);
});

player.addEventListener('pause', () => { if (videoPlaying) { videoPlaying = false; updateVideoUI(); } });
player.addEventListener('play', () => { videoPlaying = true; updateVideoUI(); });

loadVideo(0);

document.getElementById('videoTab').addEventListener('click', () => {
  document.getElementById('videoTab').classList.add('active');
  document.getElementById('gameTab').classList.remove('active');
  document.getElementById('videoSection').style.display = 'flex';
  document.getElementById('gameSection').style.display = 'none';
  
  pauseGame();
});

document.getElementById('gameTab').addEventListener('click', () => {
  document.getElementById('gameTab').classList.add('active');
  document.getElementById('videoTab').classList.remove('active');
  document.getElementById('videoSection').style.display = 'none';
  document.getElementById('gameSection').style.display = 'flex';
  
  if (!player.paused) {
    player.pause();
    videoPlaying = false;
    updateVideoUI();
  }
  
  initGame();
});

const gameCanvas = document.getElementById('gameCanvas');
const gameCtx = gameCanvas.getContext('2d');
const frogCharacterContainer = document.getElementById('frogCharacterContainer');
const frogRunVideo = document.getElementById('frogRunVideo');
const frogJumpVideo = document.getElementById('frogJumpVideo');
const frogFallVideo = document.getElementById('frogFallVideo');

const pauseGame = function() {
  if (frogRunVideo) frogRunVideo.pause();
  if (frogJumpVideo) frogJumpVideo.pause();
  if (frogFallVideo) frogFallVideo.pause();
  
  gameRunning = false;
  obstacles = [];
  particles = [];
};

let gameScore = 0;
let gameHighScore = parseInt(localStorage.getItem('frogRunHighScore') || '0');
let gameRunning = false;
let gameSpeed = 5;
let lastObstacleTime = 0;
let obstacles = [];
let particles = [];
let reachedMaxScore = false;
let groundHeight = 60;

const OBSTACLE_IMAGES = [
  'https://pan.imgbed.link/file/370956',
  'https://pan.imgbed.link/file/370961',
  'https://pan.imgbed.link/file/370959',
  'https://pan.imgbed.link/file/370958',
  'https://pan.imgbed.link/file/370957',
  'https://pan.imgbed.link/file/370960'
];

const BACKGROUND_IMAGE = 'https://pan.imgbed.link/file/370962';

let obstacleImages = [];
let backgroundImage = null;
let imagesLoaded = false;

const frog = {
  x: 60,
  y: 0,
  width: 80,
  height: 96,
  velocityY: 0,
  isJumping: false,
  isFalling: false,
  jumpForce: -14,
  gravity: 0.65,
  groundY: 0,
  frameCount: 0,
  laughFrame: 0,
  isLaughing: false,
  isFalling: false,
  fallFrame: 0,
  fallPlayed: false
};

function initGame() {
  if (!imagesLoaded) {
    loadObstacleImages();
  }
  
  resizeGameCanvas();
  
  if (frogRunVideo) {
    frogRunVideo.currentTime = 0;
    frogRunVideo.play().catch(() => {});
  }
}

function loadObstacleImages() {
  let loadedCount = 0;
  let totalImages = OBSTACLE_IMAGES.length + 1;
  
  backgroundImage = new Image();
  backgroundImage.onload = () => {
    loadedCount++;
    if (loadedCount === totalImages) {
      imagesLoaded = true;
    }
  };
  backgroundImage.onerror = () => {
    loadedCount++;
    if (loadedCount === totalImages) {
      imagesLoaded = true;
    }
  };
  backgroundImage.src = BACKGROUND_IMAGE;
  
  OBSTACLE_IMAGES.forEach((src, index) => {
    const img = new Image();
    img.onload = () => {
      loadedCount++;
      if (loadedCount === totalImages) {
        imagesLoaded = true;
      }
    };
    img.onerror = () => {
      loadedCount++;
      if (loadedCount === totalImages) {
        imagesLoaded = true;
      }
    };
    img.src = src;
    obstacleImages.push(img);
  });
}

function resizeGameCanvas() {
  const container = document.querySelector('.game-container');
  gameCanvas.width = container.clientWidth;
  gameCanvas.height = container.clientHeight;
  
  const canvasWidth = gameCanvas.width;
  const canvasHeight = gameCanvas.height;
  
  groundHeight = Math.max(50, canvasHeight * 0.12);
  
  if (canvasWidth <= 320) {
    frog.width = 55;
    frog.height = 55;
    frog.x = canvasWidth * 0.1;
  } else if (canvasWidth <= 400) {
    frog.width = 65;
    frog.height = 65;
    frog.x = canvasWidth * 0.12;
  } else if (canvasWidth <= 600) {
    frog.width = 75;
    frog.height = 75;
    frog.x = canvasWidth * 0.1;
  } else {
    frog.width = 80;
    frog.height = 96;
    frog.x = 60;
  }
  
  const frogContainer = document.getElementById('frogCharacterContainer');
  if (frogContainer) {
    frogContainer.style.width = frog.width + 'px';
    frogContainer.style.height = frog.height + 'px';
  }
  
  frog.groundY = canvasHeight - groundHeight - frog.height;
  frog.y = frog.groundY;
}

let lastState = 'running';

function updateFrogPosition() {
  let scaleX = 1;
  let scaleY = 1;
  let rotation = 0;
  let extraY = 0;
  
  let currentState = 'running';
  
  if (frog.isLaughing) {
    currentState = 'laughing';
    frog.laughFrame++;
    const laughCycle = frog.laughFrame * 0.3;
    
    extraY = Math.sin(laughCycle) * 8;
    scaleX = 1 + Math.sin(laughCycle * 0.67) * 0.15;
    scaleY = 1 + Math.sin(laughCycle * 0.67) * 0.15;
    rotation = Math.sin(laughCycle) * 15;
  } else if (frog.isFalling) {
    currentState = 'falling';
    frog.fallFrame++;
    
    // 摔跤时保持平稳，不抖动
    scaleX = 1;
    scaleY = 1;
    rotation = 0;
    extraY = 0;
    
    if (!frog.fallPlayed) {
      frog.fallPlayed = true;
      const fallVideo = document.getElementById('frogFallVideo');
      if (fallVideo) {
        fallVideo.style.display = 'block';
        fallVideo.currentTime = 0;
        fallVideo.play().catch(() => {});
        
        fallVideo.onended = () => {
          endGameWithFall();
        };
      }
    }
  } else if (frog.isJumping) {
    currentState = 'jumping';
    const jumpProgress = Math.abs(frog.velocityY) / Math.abs(frog.jumpForce);
    
    if (frog.velocityY < 0) {
      rotation = -12;
      scaleX = 1.1;
      scaleY = 0.9;
    } else {
      rotation = 12;
      scaleX = 0.9;
      scaleY = 1.1;
    }
    
    scaleX = 1 + (scaleX - 1) * jumpProgress;
    scaleY = 1 + (scaleY - 1) * jumpProgress;
    rotation = rotation * jumpProgress;
  } else {
    // 跑步时添加轻微的上下抖动
    frog.frameCount++;
    const runSpeed = gameSpeed * 0.15;
    const bounceCycle = frog.frameCount * runSpeed;
    
    extraY = Math.sin(bounceCycle) * 2;
    scaleY = 1 + Math.sin(bounceCycle) * 0.03;
    scaleX = 1 - Math.sin(bounceCycle) * 0.02;
    rotation = 0;
  }
  
  if (currentState !== lastState && currentState !== 'falling') {
    const runVideo = document.getElementById('frogRunVideo');
    const jumpVideo = document.getElementById('frogJumpVideo');
    const fallVideo = document.getElementById('frogFallVideo');
    
    if (currentState === 'jumping') {
      runVideo.style.display = 'none';
      fallVideo.style.display = 'none';
      jumpVideo.style.display = 'block';
      jumpVideo.currentTime = 0;
      jumpVideo.play().catch(() => {});
    } else if (currentState === 'running' || currentState === 'laughing') {
      jumpVideo.style.display = 'none';
      fallVideo.style.display = 'none';
      runVideo.style.display = 'block';
    }
    
    lastState = currentState;
  }
  
  frogCharacterContainer.style.left = (frog.x) + 'px';
  frogCharacterContainer.style.top = (frog.y + extraY) + 'px';
  frogCharacterContainer.style.transform = `scaleX(${scaleX}) scaleY(${scaleY}) rotate(${rotation}deg)`;
}

function endGameWithFall() {
  gameRunning = false;
  
  if (gameScore > gameHighScore) {
    gameHighScore = gameScore;
    localStorage.setItem('frogRunHighScore', gameHighScore.toString());
    document.getElementById('gameNewRecord').style.display = 'block';
  } else {
    document.getElementById('gameNewRecord').style.display = 'none';
  }
  
  document.getElementById('finalGameScore').textContent = gameScore;
  document.getElementById('gameOverScreen').classList.add('show');
}

function drawGameBackground() {
  if (backgroundImage && backgroundImage.complete) {
    gameCtx.drawImage(backgroundImage, 0, 0, gameCanvas.width, gameCanvas.height);
  } else {
    const gradient = gameCtx.createLinearGradient(0, 0, 0, gameCanvas.height);
    gradient.addColorStop(0, '#ecfdf5');
    gradient.addColorStop(0.6, '#d1fae5');
    gradient.addColorStop(1, '#a7f3d0');
    gameCtx.fillStyle = gradient;
    gameCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
    
    drawGameClouds();
  }
  
  gameCtx.fillStyle = '#065f46';
  gameCtx.fillRect(0, gameCanvas.height - groundHeight, gameCanvas.width, groundHeight);
  
  const grassSpacing = Math.max(12, Math.min(15, gameCanvas.width * 0.025));
  gameCtx.fillStyle = '#047857';
  for (let i = 0; i < gameCanvas.width; i += grassSpacing) {
    gameCtx.beginPath();
    gameCtx.moveTo(i, gameCanvas.height - groundHeight);
    gameCtx.lineTo(i + grassSpacing * 0.27, gameCanvas.height - groundHeight - 15);
    gameCtx.lineTo(i + grassSpacing * 0.53, gameCanvas.height - groundHeight);
    gameCtx.fill();
  }
}

let cloudOffset = 0;
function drawGameClouds() {
  gameCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  
  const clouds = [
    { x: (50 + cloudOffset) % (gameCanvas.width + 150) - 75, y: 40, size: 0.8 },
    { x: (200 + cloudOffset * 0.6) % (gameCanvas.width + 150) - 75, y: 80, size: 0.6 },
    { x: (350 + cloudOffset * 0.4) % (gameCanvas.width + 150) - 75, y: 30, size: 1 },
    { x: (500 + cloudOffset * 0.7) % (gameCanvas.width + 150) - 75, y: 60, size: 0.7 }
  ];
  
  clouds.forEach(cloud => {
    gameCtx.save();
    gameCtx.translate(cloud.x, cloud.y);
    gameCtx.scale(cloud.size, cloud.size);
    gameCtx.beginPath();
    gameCtx.arc(0, 0, 25, 0, Math.PI * 2);
    gameCtx.arc(25, -8, 20, 0, Math.PI * 2);
    gameCtx.arc(50, 0, 25, 0, Math.PI * 2);
    gameCtx.arc(25, 8, 20, 0, Math.PI * 2);
    gameCtx.fill();
    gameCtx.restore();
  });
  
  cloudOffset += 0.2;
}

function createObstacle() {
  const imgIndex = Math.floor(Math.random() * obstacleImages.length);
  
  let obstacle = {
    x: gameCanvas.width + 50,
    imgIndex: imgIndex,
    width: Math.max(40, Math.min(60, gameCanvas.width * 0.12)),
    height: Math.max(40, Math.min(60, gameCanvas.width * 0.12))
  };
  
  obstacle.y = gameCanvas.height - groundHeight - obstacle.height;
  obstacles.push(obstacle);
}

function drawObstacles() {
  obstacles.forEach(obs => {
    gameCtx.save();
    
    const img = obstacleImages[obs.imgIndex];
    if (img && img.complete) {
      gameCtx.drawImage(img, obs.x, obs.y, obs.width, obs.height);
    } else {
      gameCtx.fillStyle = '#8B4513';
      gameCtx.fillRect(obs.x, obs.y, obs.width, obs.height);
    }
    
    gameCtx.restore();
  });
}

function createParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      size: Math.random() * 6 + 3,
      color: color,
      life: 1
    });
  }
}

function drawParticles() {
  particles = particles.filter(p => p.life > 0);
  
  particles.forEach(p => {
    gameCtx.fillStyle = p.color;
    gameCtx.globalAlpha = p.life;
    gameCtx.beginPath();
    gameCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    gameCtx.fill();
    
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.025;
  });
  
  gameCtx.globalAlpha = 1;
}

function checkCollision() {
  if (frog.isFalling || frog.isLaughing) return;
  
  const frogRect = {
    x: frog.x + frog.width * 0.15,
    y: frog.y + frog.height * 0.2,
    width: frog.width * 0.7,
    height: frog.height * 0.7
  };
  
  for (const obs of obstacles) {
    const obsRect = {
      x: obs.x + 5,
      y: obs.y + 5,
      width: obs.width - 10,
      height: obs.height - 10
    };
    
    if (rectIntersect(frogRect, obsRect)) {
      frog.isFalling = true;
      frog.fallFrame = 0;
      frog.fallPlayed = false;
      frog.velocityY = 0;
      frog.isJumping = false;
      return;
    }
  }
}

function rectIntersect(a, b) {
  return a.x < b.x + b.width &&
         a.x + a.width > b.x &&
         a.y < b.y + b.height &&
         a.y + a.height > b.y;
}

function updateGameScore() {
  if (gameScore < GAME_MAX_SCORE) {
    gameScore++;
    document.getElementById('gameScore').textContent = gameScore;
    
    const progress = (gameScore / GAME_MAX_SCORE) * 100;
    document.getElementById('progressBar').style.width = `${progress}%`;
    
    if (gameScore === GAME_MAX_SCORE) {
      reachedMaxScore = true;
      frog.isLaughing = true;
      document.getElementById('maxBadge').style.display = 'block';
      
      if (frogRunVideo) {
        frogRunVideo.src = VIDEO_LIST[0].video;
        frogRunVideo.currentTime = 0;
        frogRunVideo.play().catch(() => {});
      }
    }
    
    if (gameScore % 100 === 0 && gameSpeed < 12) {
      gameSpeed = Math.min(gameSpeed + 0.2, 12);
    }
  }
}

function gameOver() {
  gameRunning = false;
  
  if (gameScore > gameHighScore && gameScore < GAME_MAX_SCORE) {
    gameHighScore = gameScore;
    localStorage.setItem('frogRunHighScore', gameHighScore.toString());
    document.getElementById('gameNewRecord').style.display = 'block';
  } else {
    document.getElementById('gameNewRecord').style.display = 'none';
  }
  
  document.getElementById('finalGameScore').textContent = gameScore;
  document.getElementById('gameOverScreen').classList.add('show');
  
  if (frogRunVideo) {
    frogRunVideo.pause();
  }
}

function jump() {
  if (!frog.isJumping && gameRunning && !frog.isLaughing) {
    frog.velocityY = frog.jumpForce;
    frog.isJumping = true;
    createParticles(frog.x + frog.width / 2, frog.y + frog.height, '#a7f3d0');
  }
}

function updateGame() {
  if (!gameRunning) return;
  
  frog.frameCount++;
  frog.velocityY += frog.gravity;
  frog.y += frog.velocityY;
  
  if (frog.y >= frog.groundY) {
    frog.y = frog.groundY;
    frog.velocityY = 0;
    frog.isJumping = false;
  }
  
  obstacles.forEach(obs => {
    obs.x -= gameSpeed;
  });
  
  obstacles = obstacles.filter(obs => obs.x > -80);
  
  const now = Date.now();
  if (now - lastObstacleTime > 1400 - gameSpeed * 25) {
    createObstacle();
    lastObstacleTime = now;
  }
  
  updateGameScore();
  
  if (!reachedMaxScore) {
    checkCollision();
  }
}

function drawGame() {
  gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
  
  drawGameBackground();
  drawObstacles();
  drawParticles();
  updateFrogPosition();
}

function gameLoop() {
  updateGame();
  drawGame();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  gameScore = 0;
  gameSpeed = 5;
  obstacles = [];
  particles = [];
  reachedMaxScore = false;
  frog.y = frog.groundY;
  frog.velocityY = 0;
  frog.isJumping = false;
  frog.isFalling = false;
  frog.isLaughing = false;
  frog.laughFrame = 0;
  frog.fallFrame = 0;
  frog.fallPlayed = false;
  lastObstacleTime = Date.now();
  lastState = 'running';
  
  document.getElementById('gameScore').textContent = '0';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('maxBadge').style.display = 'none';
  
  const runVideo = document.getElementById('frogRunVideo');
  const jumpVideo = document.getElementById('frogJumpVideo');
  const fallVideo = document.getElementById('frogFallVideo');
  
  if (runVideo) {
    runVideo.style.display = 'block';
    runVideo.currentTime = 0;
    runVideo.play().catch(() => {});
  }
  
  if (jumpVideo) {
    jumpVideo.style.display = 'none';
    jumpVideo.load();
  }
  
  if (fallVideo) {
    fallVideo.style.display = 'none';
    fallVideo.load();
  }
  
  document.getElementById('gameStartScreen').style.display = 'none';
  document.getElementById('gameOverScreen').classList.remove('show');
  
  gameRunning = true;
}

document.getElementById('startGameBtn').addEventListener('click', startGame);
document.getElementById('restartGameBtn').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!gameRunning && document.getElementById('gameSection').style.display === 'flex') {
      const startScreen = document.getElementById('gameStartScreen');
      if (startScreen.style.display !== 'none') {
        startGame();
      } else {
        jump();
      }
    } else {
      jump();
    }
  }
});

gameCanvas.addEventListener('click', () => {
  if (!gameRunning) {
    const startScreen = document.getElementById('gameStartScreen');
    if (startScreen.style.display !== 'none') {
      startGame();
    }
  } else {
    jump();
  }
});

gameCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!gameRunning) {
    const startScreen = document.getElementById('gameStartScreen');
    if (startScreen.style.display !== 'none') {
      startGame();
    }
  } else {
    jump();
  }
});

window.addEventListener('resize', () => {
  resizeGameCanvas();
  updateFrogPosition();
});

resizeGameCanvas();
gameLoop();
</script>
</body>
</html>
