name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install npm dependencies
      run: npm install
    
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 34
        build-tools: 34.0.0
    
    - name: Install Capacitor packages
      run: npm install @capacitor/core @capacitor/cli @capacitor/android
    
    - name: Build web app
      run: npm run build
    
    - name: Initialize Capacitor
      run: npx cap init "奶娃" "com.naiwa.frog" --web-dir=dist
    
    - name: Add Android platform
      run: npx cap add android
    
    - name: Fix Java version to 17
      run: |
        if grep -q "VERSION_21" android/app/capacitor.build.gradle; then
          sed -i 's/VERSION_21/VERSION_17/g' android/app/capacitor.build.gradle
        fi
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: naiwa-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
